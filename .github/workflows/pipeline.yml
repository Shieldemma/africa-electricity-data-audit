name: data-pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["outputs/**", "docs/**"]
  schedule:
    - cron: "17 6 1 * *"   # monthly refresh, picks up new OWID / Ember releases
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Run pipeline (OWID + Ember + World Bank)
        run: python run_pipeline.py
      - name: Commit refreshed outputs and dashboard
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add outputs docs
          git diff --cached --quiet || git commit -m "Refresh outputs and dashboard [skip ci]"
          git push
